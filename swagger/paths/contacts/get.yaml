tags:
  - Contacts

summary: Get all contacts

operationId: getContacts

description: Retrieve a list of all contacts.

security:
  - bearerAuth: []

parameters:
  - name: page
    in: query
    schema:
      type: integer
      example: 1
  - name: limit
    in: query
    schema:
      type: integer
      example: 10

responses:
  '200':
    description: Successfully retrieved contacts list
